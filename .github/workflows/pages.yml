name: pages

# Builds the real wheel and publishes the browser demo to
# https://egnaro9.github.io/rag-eval-lab/ — the page pip-installs that wheel
# into Pyodide, so the demo always runs the code currently on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gradecore is a real dependency, and micropip cannot resolve the
      # `gradecore @ git+https://...` requirement the wheel declares — it tries
      # to parse "gradecore" as a wheel filename and fails, which took the whole
      # demo down. Build both wheels here and let the page install gradecore
      # first, so the requirement is already satisfied.
      - name: Check out gradecore
        uses: actions/checkout@v4
        with:
          repository: egnaro9/gradecore
          path: .gradecore

      - name: Build both wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m build --wheel --outdir dist .gradecore

      - name: Assemble the demo site
        run: |
          mkdir -p site
          cp demo/index.html demo/app.js site/
          cp dist/*.whl site/
          WHEEL=$(cd dist && ls ragevallab-*.whl | head -1)
          GRADECORE=$(cd dist && ls gradecore-*.whl | head -1)
          test -n "$WHEEL" -a -n "$GRADECORE"   # fail loudly rather than ship a dead page
          {
            echo "window.WHEEL_URL = './${WHEEL}';"
            echo "window.GRADECORE_WHEEL_URL = './${GRADECORE}';"
          } > site/wheel.js
          echo "Demo will install: ${GRADECORE} then ${WHEEL}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
