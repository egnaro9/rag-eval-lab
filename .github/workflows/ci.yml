name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (stdlib-only core + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch SciFact (BEIR) so the benchmark claim is TESTED, not asserted
        run: |
          # The README's headline number (BM25 0.664 vs published 0.665) had no
          # guard until 2026-08-17: no dataset in CI, no job running the
          # benchmark. tests/test_scifact_benchmark.py hard-fails under CI if
          # this directory is missing, so this step cannot be dropped silently.
          curl -sL -o scifact.zip "https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/scifact.zip"
          unzip -o -q scifact.zip
          rm scifact.zip
      - name: Run tests
        run: pytest -q
      # Was scripts/check_readme_test_count.py here until 2026-10-10. Four other
      # repositories held byte-identical copies, so it is a package now. Pinned to a
      # commit, not main: a gate that tracks someone else's default branch is a gate
      # that person can change, and it being me makes that worse rather than better.
      - name: README's advertised test count must match the suite
        run: |
          set -o pipefail
          pip install "git+https://github.com/egnaro9/readme-test-count@6752d7ec7e6177aceff6359905b1d68ab90b546a"
          readme-test-count
      - name: Run the eval CLI (smoke) and prove the hallucination is flagged
        run: |
          python -m ragevallab.cli eval --out eval_run.json
          python - <<'PY'
          import json, sys
          run = json.load(open("eval_run.json"))
          flagged = [c for c in run["cases"] if c["flagged"]]
          assert len(flagged) == 1, f"expected 1 flagged case, got {len(flagged)}"
          assert "PLANTED" in flagged[0]["note"]
          print("OK: eval harness flagged the planted hallucination")
          PY

  # A Dockerfile nobody builds is a promise, not an artifact. This repo shipped
  # one for months with nothing checking it, which is the exact shape of problem
  # the rest of the repo exists to argue against — so it gets built, and the
  # image gets run, on every push.
  docker:
    name: the image actually builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t rag-eval-lab:ci .
      - name: Run the eval inside the image
        run: |
          docker run --rm rag-eval-lab:ci | tee /tmp/out.txt
          grep -q "PLANTED" /tmp/out.txt || {
            echo "::error::the image ran but didn't flag the planted hallucination"; exit 1; }
      - name: The test suite passes inside the image too
        run: docker run --rm rag-eval-lab:ci pytest -q

  # Every push to main gets its eval run stored, so the history is a record of
  # what this repo actually scored per commit rather than a demo dataset.
  #
  # Not part of `test`: recording is a side effect, and eval-history sleeping on
  # a free tier must never turn this repo's CI red. The eval is the product; the
  # bookkeeping is not allowed to fail the thing it books.
  record:
    name: record the run in eval-history
    needs: test
    # main only: fork PRs have no secrets, and a PR run would record a score
    # for code that never landed. workflow_dispatch is allowed so a run can be
    # re-recorded without inventing a commit to hang it on.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # eval-history's hosted API is gone: Render dropped its free tier on
      # 2026-08-30 and this job POSTed into the void for 13 days. It is
      # continue-on-error, so CI stayed green while the archive quietly stopped
      # gaining rag-eval-lab rows. Writing straight to the database the archive
      # reads takes the process out of the path entirely.
      - run: |
          pip install -e .
          pip install 'evalhistory @ git+https://github.com/egnaro9/eval-history' \
                      'psycopg[binary]>=3.1'
      - name: Run the eval
        run: python -m ragevallab.cli eval --out eval_run.json
      - name: Record it in eval-history
        env:
          # Never echoed, never an argument. post_run.py reads it from the
          # environment, and a --database-url flag is deliberately absent: a
          # connection string on a command line lands in the CI log.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/post_run.py --db \
            --file eval_run.json \
            --git-sha "${GITHUB_SHA:0:7}" \
            --label "$(git log -1 --pretty=%s)"
      - name: How many runs are published?
        run: |
          curl -sS --max-time 30 "https://erikhill.dev/eval-history/runs.json" \
            | python -c "import json,sys; rs=json.load(sys.stdin); rs=rs if isinstance(rs,list) else rs.get('runs',[]); rag=[r for r in rs if r.get('name')=='rag-eval-lab']; print(f'{len(rag)} rag-eval-lab runs published, newest', max((r.get('created_at','') for r in rag), default='none'))" \
            || echo "(the archive refreshes daily; this run will appear in the next export)"

  gate:
    name: prompt-regress — PR eval gate
    needs: test
    # PRs only, and pull-requests:write means same-repo PRs; fork PRs lack the
    # secret, and the action skips cleanly when the write key is empty.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run the eval
        run: python -m ragevallab.cli eval --out eval_run.json
      # Dogfood: gate this repo's own evals against its main-branch baseline.
      - uses: egnaro9/prompt-regress@main
        with:
          run: eval_run.json
          suite: rag-eval-lab
          write-key: ${{ secrets.EVAL_HISTORY_WRITE_KEY }}

  # The pgvector backend was shipped with `# pragma: no cover` — a real path the
  # suite never ran. This job runs it against a real pgvector-enabled Postgres,
  # so "it works with pgvector" is demonstrated, not asserted. The default `test`
  # job still skips it (no DATABASE_URL), so a normal run needs no database.
  pgvector:
    name: pgvector integration
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,pgvector]"
      - name: Exercise the real pgvector backend (store, search, schema version)
        env:
          DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
        run: pytest -q tests/test_pgvector.py -rs
