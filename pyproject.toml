[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragevallab"
version = "0.1.0"
description = "A stdlib-core RAG pipeline with a deterministic, no-LLM-judge evaluation harness that catches hallucinations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erik Hill", email = "erik.hill0987@gmail.com" }]
keywords = ["rag", "retrieval", "evaluation", "vector-database", "pgvector", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The grounding grader is shared, not vendored: it comes from gradecore, the same
# zero-dependency, no-LLM-judge engine model-drift and the crash-test platform use.
#
# From PyPI, and NOT `gradecore @ git+...`. A direct URL points at a default branch,
# which is a moving ref, and pip gives a direct URL precedence over any version a
# consumer already installed. crashkit pins gradecore==0.10.0 for VAC replay
# determinism, installed this package two lines later, and pip silently replaced the
# pin with whatever main happened to be. gradecore main reached 0.10.1 on 2026-08-19;
# crashkit CI went red on 08-20 and stayed red for ten days. A library cannot know
# what its consumers pin, so it must not express a requirement that overrides them.
dependencies = ["gradecore>=0.10.0"]

[project.optional-dependencies]
# The lab core is stdlib-only. These extras enable the "real" backends and the
# optional HTTP service.
openai = ["openai>=1.0"]
pgvector = ["psycopg[binary]>=3.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
dev = ["pytest>=7", "fastapi>=0.110", "httpx>=0.27", "pydantic>=2.5"]

[project.scripts]
ragevallab = "ragevallab.cli:main"

[project.urls]
Homepage = "https://github.com/egnaro9/rag-eval-lab"

[tool.setuptools]
packages = ["ragevallab"]
